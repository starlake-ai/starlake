---
version: 1
load:
  name: "__SL_BQ_DATASET__"
  tags: ["datasetkey=value", "datasetkeynovalue"]
  metadata:
    directory: "__SL_TEST_ROOT__/position"
    format: "POSITION"
    withHeader: false
    separator: "|"
    quote: "\""
    escape: "\\"
    writeStrategy:
      type: "OVERWRITE"
    sink:
      connectionRef: bqtest
      partition:
        - date
